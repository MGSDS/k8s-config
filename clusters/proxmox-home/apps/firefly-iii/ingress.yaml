---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firefly-iii-ingress
  namespace: firefly-iii
  annotations:
    nginx.ingress.kubernetes.io/auth-url: "http://oauth2-proxy.firefly-iii.svc.cluster.local/oauth2/auth"
    nginx.ingress.kubernetes.io/auth-signin: "https://firefly.mgsds.com/oauth2/start?rd=$escaped_request_uri"
    nginx.ingress.kubernetes.io/auth-response-headers: X-Auth-Request-Email
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: firefly-iii-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - firefly.mgsds.com
  rules:
    - host: firefly.mgsds.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: firefly-iii
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: firefly-iii-oauth2-proxy-ingress
  namespace: firefly-iii
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: firefly-iii-oauth2-proxy-ingress
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - firefly.mgsds.com
  rules:
    - host: firefly.mgsds.com
      http:
        paths:
          - path: /oauth2
            pathType: Prefix
            backend:
              service:
                name: oauth2-proxy
                port:
                  number: 80

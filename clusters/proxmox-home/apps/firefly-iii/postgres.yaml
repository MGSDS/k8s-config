kind: "postgresql"
apiVersion: "acid.zalan.do/v1"

metadata:
  name: "firefly-iii-db"
  namespace: "firefly-iii"
  labels:
    team: acid
    app.kubernetes.io/name: firefly-iii-db
    app.kubernetes.io/component: database

spec:
  teamId: "acid"
  postgresql:
    version: "16"
  numberOfInstances: 1
  volume:
    size: "5Gi"
  users:
    firefly-iii-user: []
  databases:
    firefly: firefly-iii-user
  allowedSourceRanges:

  resources:
    requests:
      cpu: 100m
      memory: 100Mi
    limits:
      cpu: 500m
      memory: 500Mi

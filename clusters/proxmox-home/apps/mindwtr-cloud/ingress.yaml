apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mindwtr-cloud-ingress
  namespace: mindwtr-cloud
  labels:
    app.kubernetes.io/name: mindwtr-cloud-ingress
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 50m
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mindwtr.mgsds.com
  rules:
    - host: mindwtr.mgsds.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: mindwtr-cloud
                port:
                  number: 80

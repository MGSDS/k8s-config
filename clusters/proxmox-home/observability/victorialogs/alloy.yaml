---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: victorialogs
spec:
  interval: 1h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy
  namespace: victorialogs
spec:
  interval: 10m
  chart:
    spec:
      chart: alloy
      version: "1.14.3"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: victorialogs
      interval: 1h
  values:
    controller:
      type: daemonset
      tolerations:
        - operator: Exists
    alloy:
      configMap:
        content: |-
          logging {
            level = "info"
          }

          discovery.kubernetes "pods" {
            role = "pod"
          }

          loki.source.kubernetes "pod_logs" {
            targets    = discovery.kubernetes.pods.targets
            forward_to = [loki.relabel.service_name.receiver]
          }

          loki.relabel "service_name" {
            forward_to = [loki.process.pipeline.receiver]

            rule {
              source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
              target_label  = "service_name"
              regex         = "(.+)"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_cluster_name"]
              target_label  = "service_name"
              regex         = "(.+)"
            }
            rule {
              source_labels = ["__meta_kubernetes_pod_label_app"]
              target_label  = "service_name"
              regex         = "(.+)"
            }
          }

          loki.process "pipeline" {
            forward_to = [loki.write.victorialogs.receiver]

            stage.cri {}
            stage.decolorize {}

            stage.regex {
              expression = '(?i)(?:^|\s|"|\b)(?:level|lvl|severity)[=:]\s*"?(?P<level>trace|debug|dbg|info|inf|notice|warn|warning|wrn|error|err|critical|fatal|panic)"?'
            }

            stage.regex {
              expression = '(?P<level>TRACE|DEBUG|DBG|INFO|INF|NOTICE|WARN|WARNING|WRN|ERROR|ERR|CRITICAL|FATAL|PANIC)\b'
            }

            stage.template {
              source   = "level"
              template = "{{ ToLower .Value }}"
            }

            stage.labels {
              values = {
                level = "level",
              }
            }
          }

          loki.write "victorialogs" {
            endpoint {
              url = "http://vlogs-victoria-logs-single-server.victorialogs.svc.cluster.local:9428/insert/loki/api/v1/push"
            }
          }

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: kubernetes-dashboard
  labels:
    app.kubernetes.io/component: ingress
    app.kubernetes.io/name: headlamp
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - dash.mgsds.com
  rules:
    - host: dash.mgsds.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: headlamp
                port:
                  number: 80

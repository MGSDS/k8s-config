---
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: sealed-secrets
  namespace: sealed-secrets
spec:
  interval: 1m
  url: oci://registry-1.docker.io/bitnamicharts/sealed-secrets
  ref:
    tag: 2.22.0
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: copy
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: sealed-secrets
  namespace: sealed-secrets
spec:
  interval: 10m
  chartRef:
    kind: OCIRepository
    name: sealed-secrets
---
